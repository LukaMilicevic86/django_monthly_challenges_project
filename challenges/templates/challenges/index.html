

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All challenges</title>
</head>
<body>
    <ul>
        {% for month in months_list %}
            <li><a href="{% url "month_challenge" month %}">{{ month|title }}</a></li>
            <!-- url tag arguments are those from urls.py, separated by blank spaces-->
        {% endfor %}
    </ul>
</body>
</html>
